name: deploy-paper

# Publishes the static research paper in paper/ to GitHub Pages.
# configure-pages enables Pages itself (enablement: true), so no manual
# Settings toggle is needed. After that every push to main redeploys.

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload paper site
        uses: actions/upload-pages-artifact@v3
        with:
          path: paper
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
